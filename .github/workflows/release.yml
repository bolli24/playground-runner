# Builds the runner on every push to main and publishes the binary to the rolling "latest"
# release, where deploy/update-runner.sh downloads it from.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Same Ubuntu release as the VPS, so the binary links against a compatible glibc
    runs-on: ubuntu-24.04
    # Limits per step, so a hang fails quickly; this covers the rest, like rust-cache saving
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 2
      - uses: dtolnay/rust-toolchain@stable
        timeout-minutes: 5
      - uses: Swatinem/rust-cache@v2
        timeout-minutes: 5

      - run: cargo test --locked
        timeout-minutes: 15
      - run: cargo build --release --locked
        timeout-minutes: 15

      - name: Publish to the "latest" release
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset=playground-runner-x86_64-linux
          cp target/release/playground-runner "$asset"
          sha256sum "$asset" > "$asset.sha256"
          if ! gh release view latest > /dev/null 2>&1; then
            gh release create latest --title "Latest build" --notes "Built from $GITHUB_SHA"
          fi
          gh release upload latest "$asset" "$asset.sha256" --clobber
          gh release edit latest --notes "Built from $GITHUB_SHA"
