# Reusable workflow: checks a language image against CONTRACT.md under gVisor.
# Called by the language repos after building an image, see their playground workflows.

name: Contract test

on:
  workflow_call:
    inputs:
      image:
        description: Image to check, e.g. ghcr.io/bolli24/luga:sha-0123456789ab
        required: true
        type: string
      runner-ref:
        description: Ref of the runner to test with
        default: main
        type: string

permissions:
  contents: read
  packages: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    # Every step has its own limit, so a hung download fails within minutes instead of after
    # GitHub's default of 6 hours. This covers what they don't, like rust-cache saving at the end.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 2
        with:
          repository: bolli24/playground-runner
          ref: ${{ inputs.runner-ref }}

      # The release tarball from gVisor's bucket rather than its apt repository: apt-get update
      # also refreshes the Ubuntu mirrors, which can hang for many minutes when one is down. The
      # tarball has the apt package's layout: runsc with the gvisor-bin/ helpers next to it.
      - name: Install gVisor
        timeout-minutes: 5
        run: |
          url=https://storage.googleapis.com/gvisor/releases/release/latest/x86_64
          curl -fsSL --retry 3 -O "$url/gvisor.tar.bz2" -O "$url/gvisor.tar.bz2.sha512"
          sha512sum -c gvisor.tar.bz2.sha512
          sudo tar -xjf gvisor.tar.bz2 -C /usr/local/bin
          rm gvisor.tar.bz2 gvisor.tar.bz2.sha512
          sudo runsc install
          sudo systemctl restart docker
          docker info --format '{{json .Runtimes}}'

      - uses: dtolnay/rust-toolchain@stable
        timeout-minutes: 5
      - uses: Swatinem/rust-cache@v2
        timeout-minutes: 5

      - name: Build runner
        timeout-minutes: 15
        run: cargo build --release --locked

      - uses: docker/login-action@v3
        timeout-minutes: 2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        timeout-minutes: 10
        run: docker pull "${{ inputs.image }}"

      - name: Contract test
        timeout-minutes: 10
        run: |
          cat > ci.toml <<'EOF'
          runtime = "runsc"
          languages = {}
          EOF
          ./target/release/playground-runner --config ci.toml contract --image "${{ inputs.image }}"
